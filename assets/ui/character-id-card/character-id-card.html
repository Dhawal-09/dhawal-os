<!doctype html>
<!--
  Source for public/assets/special/character-id-card.png.
  Render with: node assets/ui/character-id-card/render.mjs
  Photo = frame 1 of the in-game idle-down sprite, cropped to head and
  shoulders and scaled 2x nearest-neighbour (no redraw).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Kongtext';
        src: url('../../../public/assets/Font/kongtext/kongtext.ttf') format('truetype');
      }

      :root {
        --bg-deep: #050b1a;
        --bg-navy: #08152f;
        --panel: #0b2144;
        --panel-dark: #06142d;
        --blue: #147bff;
        --cyan: #27d7ff;
        --cyan-bright: #57e8ff;
        --purple: #4d28ac;
        --green: #39f27a;
        --text: #eaf4ff;
        --text-muted: #91a9c8;
        --pixel-border: #1e5fa8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        padding: 0;
        font-family: 'Kongtext', monospace;
        -webkit-font-smoothing: none;
        font-smooth: never;
      }

      /* Three hard-edged rings: deep outline, blue border, navy card. */
      /* Notched pixel corners: the 2px corner squares are cut out, so the
         PNG carries real transparent pixels (true RGBA), and the outline
         reads as pixel art rather than a sharp modern rectangle. */
      .card {
        position: relative;
        width: 720px;
        padding: 2px;
        background: var(--bg-deep);
        clip-path: polygon(
          2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px,
          100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px),
          calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px),
          0 calc(100% - 2px), 0 2px, 2px 2px
        );
      }

      .card-inner {
        position: relative;
        border: 2px solid var(--pixel-border);
        background: var(--bg-navy);
      }

      .tick {
        position: absolute;
        width: 10px;
        height: 10px;
        border: 0 solid var(--cyan);
        z-index: 2;
      }
      .tick.tl { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; }
      .tick.tr { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; }
      .tick.bl { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; }
      .tick.br { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; }

      /* ---- Header ---- */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 40px;
        padding: 0 10px 0 16px;
        background: var(--panel-dark);
      }

      .brand {
        color: var(--cyan);
        font-size: 12px;
        letter-spacing: 1px;
      }

      .brand .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        background: var(--purple);
        box-shadow: 0 0 0 1px var(--cyan);
        vertical-align: 2px;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .doc-title {
        color: var(--text);
        font-size: 12px;
        letter-spacing: 2px;
      }

      .close {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border: 2px solid var(--pixel-border);
        background: var(--bg-navy);
        color: var(--text);
        font-size: 10px;
        line-height: 1;
      }

      /* Divider: blue rule with cyan segments at both ends. */
      .divider {
        position: relative;
        height: 2px;
        background: var(--pixel-border);
      }
      .divider::before,
      .divider::after {
        content: '';
        position: absolute;
        top: 0;
        width: 48px;
        height: 2px;
        background: var(--cyan);
      }
      .divider::before { left: 0; }
      .divider::after { right: 0; }

      /* ---- Body ---- */
      .body {
        display: grid;
        grid-template-columns: 196px 1fr;
        gap: 28px;
        padding: 20px 24px 18px 20px;
      }

      /* Portrait frame */
      .photo-frame {
        position: relative;
        padding: 6px;
        border: 2px solid var(--pixel-border);
        background: var(--panel);
      }

      .photo {
        position: relative;
        width: 176px;
        height: 216px;
        border: 2px solid var(--bg-deep);
        background-color: var(--panel-dark);
        background-image: url('../../../public/assets/character-2-sprite-assets/idle/character2-idle-down.png');
        background-repeat: no-repeat;
        /* sheet 512x192 at 2x = 1024x384; crop frame 1 head+shoulders */
        background-size: 1024px 384px;
        background-position: -34px -20px;
        image-rendering: pixelated;
      }

      /* Faint grid floor + scanlines inside the photo */
      .photo::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(5, 11, 26, 0) 0,
          rgba(5, 11, 26, 0) 3px,
          rgba(5, 11, 26, 0.18) 3px,
          rgba(5, 11, 26, 0.18) 4px
        );
      }

      .photo-caption {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        color: var(--text-muted);
        font-size: 7px;
        letter-spacing: 1px;
      }

      /* Info */
      .info {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding-top: 4px;
      }

      .name {
        margin: 0;
        color: var(--text);
        font-size: 22px;
        line-height: 1.3;
        letter-spacing: 1px;
      }

      .role {
        margin: 8px 0 0;
        color: var(--cyan);
        font-size: 11px;
        letter-spacing: 2px;
      }

      .accent {
        display: flex;
        gap: 4px;
        margin: 14px 0 12px;
      }
      .accent span { height: 4px; background: var(--purple); }
      .accent span:nth-child(1) { width: 56px; background: var(--cyan); }
      .accent span:nth-child(2) { width: 12px; }
      .accent span:nth-child(3) { width: 6px; }
      .accent span:nth-child(4) { width: 4px; background: var(--pixel-border); }

      .rows {
        margin: 0;
      }

      .row {
        position: relative;
        display: grid;
        grid-template-columns: 132px 1fr;
        align-items: center;
        height: 30px;
        padding-left: 12px;
        border-bottom: 1px solid rgba(30, 95, 168, 0.6);
      }
      .row:last-child { border-bottom: none; }
      .row::before {
        content: '';
        position: absolute;
        left: 0;
        top: 13px;
        width: 4px;
        height: 4px;
        background: var(--pixel-border);
      }

      .row dt {
        color: var(--text-muted);
        font-size: 9px;
        letter-spacing: 1px;
      }

      .row dd {
        margin: 0;
        color: var(--text);
        font-size: 12px;
        letter-spacing: 1px;
      }

      /* ---- Footer ---- */
      .footer {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        height: 34px;
        padding: 0 16px;
        border-top: 2px solid var(--pixel-border);
        background: var(--panel-dark);
        font-size: 9px;
        letter-spacing: 1px;
      }

      .id {
        color: var(--text);
      }
      .id span { color: var(--text-muted); }

      .sys {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--pixel-border);
        font-size: 7px;
      }

      /* tiny barcode */
      .bars { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
      .bars i { display: block; width: 2px; background: var(--pixel-border); }

      .status {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        color: var(--green);
      }
      .status .led {
        width: 8px;
        height: 8px;
        background: var(--green);
        box-shadow: 0 0 0 2px rgba(57, 242, 122, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="card-inner">
        <span class="tick tl"></span><span class="tick tr"></span>
        <span class="tick bl"></span><span class="tick br"></span>

        <div class="header">
          <span class="brand"><span class="dot"></span>DHAWAL.OS</span>
          <div class="header-right">
            <span class="doc-title">CHARACTER ID</span>
            <span class="close">X</span>
          </div>
        </div>
        <div class="divider"></div>

        <div class="body">
          <div>
            <div class="photo-frame">
              <span class="tick tl"></span><span class="tick tr"></span>
              <span class="tick bl"></span><span class="tick br"></span>
              <div class="photo"></div>
            </div>
            <div class="photo-caption"><span>PHOTO</span><span>REF 01</span></div>
          </div>

          <div class="info">
            <h1 class="name">DHAWAL WANI</h1>
            <p class="role">SOFTWARE ENGINEER</p>
            <div class="accent"><span></span><span></span><span></span><span></span></div>
            <dl class="rows">
              <div class="row"><dt>AGE</dt><dd>24</dd></div>
              <div class="row"><dt>LOCATION</dt><dd>INDIA</dd></div>
              <div class="row"><dt>EDUCATION</dt><dd>MCA</dd></div>
              <div class="row"><dt>EXPERIENCE</dt><dd>1+ YEARS</dd></div>
            </dl>
          </div>
        </div>

        <div class="footer">
          <span class="id"><span>ID:</span> DHAWAL-01</span>
          <span class="sys">
            <span class="bars"><i style="height:10px"></i><i style="height:6px"></i><i style="height:10px"></i><i style="height:8px"></i><i style="height:10px"></i><i style="height:4px"></i><i style="height:10px"></i></span>
            DHAWAL.OS // SYS-ID
          </span>
          <span class="status"><span class="led"></span>ONLINE</span>
        </div>
      </div>
    </div>
  </body>
</html>
